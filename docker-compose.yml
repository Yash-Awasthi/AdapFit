# AdapFit — Docker Compose
# Full production stack: Backend + PostgreSQL + Redis + Nginx

version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: adapfit-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://adapfit:adapfit_secret@postgres:5432/adapfit
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - backend_data:/app/data
    networks:
      - adapfit-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: adapfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adapfit
      POSTGRES_USER: adapfit
      POSTGRES_PASSWORD: adapfit_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapfit -d adapfit"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adapfit-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: adapfit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adapfit-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: adapfit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html/admin:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - adapfit-network

volumes:
  postgres_data:
  redis_data:
  backend_data:
  nginx_certs:

networks:
  adapfit-network:
    driver: bridge
