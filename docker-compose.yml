# AdapFit Docker Compose — One-command deployment
# Usage: docker compose up -d

services:
  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adapfit-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AdapFit
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:19006"]
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - adapfit-net

  # ─────────────────────────────────────────────
  # Prometheus (metrics collection)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: adapfit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - adapfit-net

  # ─────────────────────────────────────────────
  # Grafana (metrics dashboards)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: adapfit-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adapfit
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - adapfit-net

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: adapfit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adapfit-net

volumes:
  backend-data:
  prometheus-data:
  grafana-data:

networks:
  adapfit-net:
    driver: bridge
