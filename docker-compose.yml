# Local stack: the backend image on real Postgres.
#   docker compose up --build        API on http://localhost:8010
# Published on loopback only; port 8000 is often taken on this machine.
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      DATABASE_URL: postgresql://adapfit:${POSTGRES_PASSWORD:-adapfit_dev_only}@postgres:5432/adapfit
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-only-change-me}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
    volumes:
      - backend_data:/app/backend/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: adapfit
      POSTGRES_USER: adapfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adapfit_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapfit -d adapfit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_data:
