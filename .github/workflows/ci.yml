name: CI

on:
  push:
    branches: [master, multi-user-personalization]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit ruff
      # Syntax errors and undefined names only; the style backlog is not a release blocker.
      - run: ruff check app scripts --select E9,F63,F7,F82
      - run: python -m pytest tests -q -p no:warnings
      - run: pip-audit -r requirements.txt

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: for f in src/services/*.check.ts; do node "$f" || exit 1; done
      # The accepted moderate advisories ship inside Expo 55 (docs/SECURITY.md).
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t adapfit:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: adapfit:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
