name: CI

on:
  push:
    branches: [master, multi-user-personalization]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # MediaPipe's native libraries and the pose model, so the pose fixture test runs.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - run: curl -fsSL -o app/data/pose_landmarker_full.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
      # Syntax errors and undefined names only; the style backlog is not a release blocker.
      - run: uv run ruff check app scripts --select E9,F63,F7,F82
      - run: uv run python -m pytest tests -q -p no:warnings
      - run: uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt" && uv run pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: for f in src/services/*.check.ts src/theme/*.check.ts; do node "$f" || exit 1; done
      # High and critical fail the build except the unpatched ones listed in the script (docs/SECURITY.md).
      - run: node scripts/audit-gate.mjs

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t adapfit:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: adapfit:ci
          # Known vulnerabilities only; yt-dlp ships sample keys in its extractors.
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
