# Sign-up to a finished workout against the API the installed build points at.
# Start from a fresh install (e2e/run.sh does that); some phones refuse to clear app data over adb.
# Health, location and microphone prompts are left for a person; this flow never touches them.
appId: com.adapfit.app
---
- runFlow: subflows/signup.yaml

# Morning check-in
- extendedWaitUntil:
    visible: Check in
    timeout: 30000
- tapOn: Check in
- tapOn: Sleep Hours 7
- scrollUntilVisible:
    element: Submit Check-in
- tapOn: Submit Check-in
- assertVisible: Today's Recovery
- assertNotVisible: No check-in

# Workout: generate, do one set, finish
- tapOn: Start workout
- extendedWaitUntil:
    visible: Start Workout
    timeout: 30000
- scrollUntilVisible:
    element: Start Workout
- tapOn: Start Workout
- tapOn: Complete Set
- tapOn: Finish Workout
- assertVisible: Post-Workout Feedback
- tapOn: Submit Feedback
- assertVisible: Adaptive Maintenance.*
