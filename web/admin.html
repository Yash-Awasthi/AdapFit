<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdapFit Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0F1629; color: #F1F5F9; min-height: 100vh; }
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #1A2238; border-radius: 16px; padding: 40px; width: 400px; border: 1px solid #253352; }
        .login-card h1 { text-align: center; margin-bottom: 8px; font-size: 28px; }
        .login-card p { text-align: center; color: #64748B; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #CBD5E1; }
        .form-group input { width: 100%; padding: 12px 16px; background: #0F172A; border: 1px solid #253352; border-radius: 8px; color: #F1F5F9; font-size: 16px; outline: none; }
        .form-group input:focus { border-color: #6366F1; }
        .btn { width: 100%; padding: 14px; background: #6366F1; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn:hover { background: #4F46E5; }
        .dashboard { display: none; padding: 32px; }
        .dashboard.active { display: block; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: #1A2238; border-radius: 12px; padding: 24px; border: 1px solid #253352; }
        .stat-card .label { font-size: 14px; color: #64748B; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 800; }
        .stat-card .value.primary { color: #6366F1; }
        .stat-card .value.green { color: #10B981; }
        .stat-card .value.orange { color: #F97316; }
        .stat-card .value.red { color: #EF4444; }
        .table-container { background: #1A2238; border-radius: 12px; padding: 24px; border: 1px solid #253352; }
        .table-container h2 { margin-bottom: 16px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #253352; }
        th { color: #64748B; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        td { font-size: 14px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge.active { background: #10B98120; color: #10B981; }
        .badge.inactive { background: #EF444420; color: #EF4444; }
        .badge.admin { background: #6366F120; color: #818CF8; }
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
        .feature-card { background: #1A2238; border-radius: 12px; padding: 20px; border: 1px solid #253352; }
        .feature-card h3 { font-size: 14px; color: #CBD5E1; margin-bottom: 4px; }
        .feature-card .count { font-size: 24px; font-weight: 700; color: #818CF8; }
    </style>
</head>
<body>
    <div class="login-container" id="loginView">
        <div class="login-card">
            <h1>AdapFit Admin</h1>
            <p>Sign in to access the admin dashboard</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@adapfit.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Sign In</button>
        </div>
    </div>

    <div class="dashboard" id="dashboardView">
        <div class="header">
            <h1>AdapFit Admin Dashboard</h1>
            <button class="btn" style="width: auto; padding: 8px 16px;" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="label">Total Users</div><div class="value primary" id="totalUsers">-</div></div>
            <div class="stat-card"><div class="label">Active Users</div><div class="value green" id="activeUsers">-</div></div>
            <div class="stat-card"><div class="label">Total Workouts</div><div class="value orange" id="totalWorkouts">-</div></div>
            <div class="stat-card"><div class="label">Database Records</div><div class="value red" id="totalRecords">-</div></div>
        </div>

        <div class="features-grid" id="featuresGrid"></div>

        <div class="table-container">
            <h2>Users</h2>
            <table>
                <thead><tr><th>ID</th><th>Email</th><th>Username</th><th>Role</th><th>Status</th><th>Joined</th></tr></thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8000/api/v1';
        let authToken = '';

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const r = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await r.json();
                if (data.tokens) {
                    authToken = data.tokens.access_token;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('dashboardView').style.display = 'block';
                    loadDashboard();
                } else {
                    alert(data.detail || 'Login failed');
                }
            } catch { alert('Network error'); }
        }

        async function loadDashboard() {
            try {
                const r = await fetch(`${API}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await r.json();
                document.getElementById('totalUsers').textContent = data.total_users || 0;
                document.getElementById('activeUsers').textContent = data.active_users || 0;
                document.getElementById('totalRecords').textContent = data.database?.total_records || 0;

                // Load users
                const ur = await fetch(`${API}/admin/users`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const udata = await ur.json();
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = (udata.users || []).map(u => `
                    <tr>
                        <td>${u.id.substring(0, 12)}...</td>
                        <td>${u.email}</td>
                        <td>${u.username}</td>
                        <td><span class="badge ${u.role}">${u.role}</span></td>
                        <td><span class="badge ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${new Date(u.created_at * 1000).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Dashboard load error:', e);
            }
        }

        function logout() {
            authToken = '';
            document.getElementById('loginView').style.display = 'flex';
            document.getElementById('dashboardView').style.display = 'none';
        }
    </script>
</body>
</html>
